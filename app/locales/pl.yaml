  app.shell.about.title: "O narzędziu SeaGarden DST"
  app.shell.about.body: |
    **Narzędzie wspomagania decyzji SeaGarden** (Decision Support Tool, DST) pomaga planować regeneracyjne farmy morskie prowadzone przez społeczności lokalne na Południowym Bałtyku. Wybierz lokalizację, zdecyduj, co i w jakiej skali hodować, a narzędzie zwróci klasyfikację lokalizacji, oczekiwane zbiory oraz ilości azotu, fosforu i węgla, które te zbiory usuwają z wody.

    **Co otrzymujesz**

    - Klasyfikację lokalizacji obliczaną jako **minimum** ze wszystkich klas ograniczeń, ze wskazaniem ograniczenia decydującego. Nie jest to indeks ważony: lokalizacja z bezwzględnym wykluczeniem prawnym nie może zostać oceniona jako „umiarkowana” tylko dlatego, że woda jest dobra.
    - **Poziom kalibracji** przy każdej liczbie - skalibrowane lokalnie, ekstrapolowane regionalnie, wartość literaturowa lub przeciwwskazane. Dopóki nie napłyną dane pilotażowe z WP3, praktycznie każda wartość dla Południowego Bałtyku jest wartością literaturową, a narzędzie zaznacza to przy samej liczbie.
    - **Presję eutrofizacyjną** z modelu bow-tie MARBEFES oraz opcjonalne **wymuszenie biogenowe** z modelu skrzynkowego EUTROPY - jedno i drugie podawane obok rankingu i nigdy do niego niewliczane.

    - **Program** - Interreg South Baltic 2021-2027 · **SeaGarden** (STHB.02.02-IP.01-0006/25)
    - **Pakiet roboczy / działanie** - WP2 / A2.3 · Produkt **D2.2**
    - **Lider** - Klaipeda University, Marine Research Institute
    - **Status** - prototyp · rdzeń modelu `v{version}`

    Kod źródłowy i zgłoszenia: [{repo_name}]({repo_url})

    We wszystkich językach liczby zapisuje się z kropką dziesiętną, a daty w formacie rok-miesiąc-dzień.

    *Prototyp. Wyniki mają charakter orientacyjny i nie stanowią podstawy do wydania pozwolenia ani zgody. Współfinansowane przez Unię Europejską; wyrażone poglądy są wyłącznie poglądami autorów.*
  app.shell.help.title: "Jak korzystać z SeaGarden DST"
  app.shell.help.body: |
    **Przebieg pracy**

    1. **Lokalizacja** - wybierz podregion. W docelowym narzędziu narysujesz wielokąt; prototyp używa warunków zastępczych dla każdego podregionu.
    2. **Katalog** - wybierz gatunki, metodę hodowli i skalę.
    3. **Oceń** - przycisk na pasku bocznym. „Wyniki” i „Raport” pozostają puste, dopóki go nie naciśniesz, i są ponownie czyszczone, gdy tylko zmienisz lokalizację.
    4. **Wyniki** - ranking opcji, ograniczenie decydujące dla każdej z nich oraz usuwanie biogenów wraz z poziomem kalibracji.
    5. **Raport** - ocena w formie tekstu, wraz z zastrzeżeniami.

    **Jak czytać poziomy kalibracji**

    | Poziom | Znaczenie | Sposób prezentacji |
    |---|---|---|
    | A | Dopasowane do danych pilotażowych SeaGarden | wartość z przedziałem |
    | B | Dopasowane w innej części Bałtyku | wartość jako zakres |
    | C | Wartość literaturowa, bez lokalnej walidacji | pasmo rzędu wielkości |
    | D | Przeciwwskazane - lokalne ustalenie przeczy modelowi | ustalenie, w miejsce liczby |

    Przypadek poziomu D, który warto znać: listownica cukrowa poniżej ok. 16 psu. Skalowanie według zasolenia daje niewielki dodatni plon; w pilotażu OLAMUR stwierdzono całkowite niepowodzenie hodowli przy 5.5-6.5 psu. Narzędzie pokazuje to ustalenie.
  app.shell.feedback.title: "Prześlij opinię"
  app.shell.feedback.body: |
    To prototyp współtworzony z użytkownikami w ramach WP2 A2.3. Najbardziej przydatne są konkretne opinie - który panel, która lokalizacja, czego oczekiwano.

    - **Utwórz zgłoszenie** - [{repo_url}/issues/new]({repo_url}/issues/new)
    - **E-mail** - [{email}](mailto:{email}?subject=SeaGarden%20DST%20feedback)
