  app.site.provenance_body: |
    Mapa pokazuje, **gdzie** leży podregion. Liczby poniżej to **warunki zastępcze**, jeden zestaw na podregion: wartości realistyczne co do rzędu wielkości, a nie pomiary, i nie są odczytywane dla danej pozycji. Każdy wynik z nich wyprowadzony jest wartością literaturową.

    W docelowym narzędziu rysujesz wielokąt, a warunki są odczytywane z wyselekcjonowanych warstw - reanaliza Copernicus Marine dla zasolenia, temperatury i biogenów, EMODnet dla batymetrii i działalności człowieka, HELCOM dla obszarów chronionych. Interfejs między tym panelem a rdzeniem modelu się nie zmienia.
