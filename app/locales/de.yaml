  app.site.provenance_body: |
    Die Karte zeigt, **wo** ein Teilgebiet liegt. Die Zahlen darunter sind **Platzhalterbedingungen**, ein Satz je Teilgebiet: plausible Werte in der richtigen Größenordnung, keine Messungen und nicht an der Position abgelesen. Jedes daraus abgeleitete Ergebnis ist ein Literaturwert.

    Im fertigen Tool wird ein Polygon gezeichnet, und die Bedingungen werden aus den kuratierten Datenebenen gelesen - Copernicus-Marine-Reanalyse für Salzgehalt, Temperatur und Nährstoffe, EMODnet für Bathymetrie und menschliche Nutzung, HELCOM für Schutzgebiete. Die Schnittstelle zwischen diesem Panel und dem Modellkern ändert sich dabei nicht.
