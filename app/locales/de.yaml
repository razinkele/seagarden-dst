  app.shell.about.title: "Über SeaGarden DST"
  app.shell.about.body: |
    Die **SeaGarden-Entscheidungshilfe** (Decision Support Tool, DST) unterstützt die Planung gemeinschaftlich getragener regenerativer Meeresfarmen in der südlichen Ostsee. Einen Standort wählen, festlegen, was in welchem Maßstab kultiviert werden soll - und das Tool liefert eine Standorteinstufung, eine erwartete Ernte sowie die Mengen an Stickstoff, Phosphor und Kohlenstoff, die diese Ernte dem Wasser entzieht.

    **Was das Tool liefert**

    - Eine Standorteinstufung, berechnet als **Minimum** über die Einschränkungsklassen, mit Nennung der maßgeblichen Einschränkung. Kein gewichteter Index: Ein Standort mit einem zwingenden rechtlichen Ausschlussgrund darf nicht „mittel“ abschneiden, nur weil das Wasser gut ist.
    - Eine **Kalibrierungsstufe** neben jeder Zahl - lokal kalibriert, regional extrapoliert, Literaturwert oder kontraindiziert. Bis die Pilotdaten aus WP3 vorliegen, ist praktisch jede Zahl für die südliche Ostsee ein Literaturwert, und das Tool weist direkt an der Zahl darauf hin.
    - **Eutrophierungsbelastung** aus dem MARBEFES-Bow-Tie-Modell und optionaler **Nährstoffantrieb** aus dem EUTROPY-Boxmodell, beide neben der Rangfolge berichtet und nie in sie eingerechnet.

    - **Programm** - Interreg South Baltic 2021-2027 · **SeaGarden** (STHB.02.02-IP.01-0006/25)
    - **Arbeitspaket / Aktivität** - WP2 / A2.3 · Deliverable **D2.2**
    - **Federführung** - Klaipeda University, Marine Research Institute
    - **Status** - Prototyp · Modellkern `v{version}`

    Quellcode & Fehlermeldungen: [{repo_name}]({repo_url})

    Zahlen verwenden in jeder Sprache einen Dezimalpunkt, und Datumsangaben werden als Jahr-Monat-Tag geschrieben.

    *Prototyp. Die Ergebnisse sind indikativ und keine Grundlage für Genehmigungen oder Zustimmungen. Kofinanziert von der Europäischen Union; die geäußerten Ansichten sind ausschließlich die der Autorinnen und Autoren.*
  app.shell.help.title: "Arbeiten mit SeaGarden DST"
  app.shell.help.body: |
    **Ablauf**

    1. **Standort** - ein Teilgebiet wählen. Im fertigen Tool wird ein Polygon gezeichnet; der Prototyp verwendet Platzhalterbedingungen je Teilgebiet.
    2. **Katalog** - Arten, Kultivierungsverfahren und Maßstab wählen.
    3. **Bewerten** - die Schaltfläche in der Seitenleiste. „Ergebnisse“ und „Bericht“ bleiben leer, bis die Schaltfläche gedrückt wird, und werden wieder geleert, sobald der Standort geändert wird.
    4. **Ergebnisse** - die Optionen in Rangfolge, jeweils mit ihrer maßgeblichen Einschränkung, und die Nährstoffentnahme mit ihrer Kalibrierungsstufe.
    5. **Bericht** - die Bewertung als Text, einschließlich der Vorbehalte.

    **Die Kalibrierungsstufen lesen**

    | Stufe | Bedeutung | Darstellung |
    |---|---|---|
    | A | An SeaGarden-Pilotdaten angepasst | Wert mit Intervall |
    | B | An anderer Stelle in der Ostsee angepasst | Wert als Spanne |
    | C | Literaturwert, keine lokale Validierung | Bandbreite der Größenordnung |
    | D | Kontraindiziert - ein lokaler Befund widerspricht dem Modell | der Befund, anstelle der Zahl |

    Der Fall der Stufe D, den man kennen sollte: Zuckertang unterhalb von etwa 16 psu. Die Salzgehaltsskalierung liefert einen kleinen positiven Ertrag; der OLAMUR-Pilotversuch stellte bei 5.5-6.5 psu ein vollständiges Scheitern der Kultivierung fest. Das Tool zeigt den Befund.
  app.shell.feedback.title: "Feedback senden"
  app.shell.feedback.body: |
    Dies ist ein Prototyp für WP2 A2.3, der in Ko-Entwicklung entsteht. Konkretes Feedback - welches Panel, welcher Standort, was erwartet wurde - ist am hilfreichsten.

    - **Ein Issue eröffnen** - [{repo_url}/issues/new]({repo_url}/issues/new)
    - **E-Mail** - [{email}](mailto:{email}?subject=SeaGarden%20DST%20feedback)
