  app.shell.about.title: "Om SeaGarden DST"
  app.shell.about.body: |
    **SeaGarden-beslutsstödsverktyget** (Decision Support Tool, DST) hjälper till att planera regenerativa havsodlingar som drivs av lokalsamhällen i södra Östersjön. Välj en plats, vad som ska odlas och i vilken skala, så ger verktyget en lämplighetsklassning av platsen, en förväntad skörd och de mängder kväve, fosfor och kol som skörden avlägsnar ur vattnet.

    **Vad verktyget ger dig**

    - En lämplighetsklassning av platsen, beräknad som **minimum** över begränsningsklasserna och med den avgörande begränsningen angiven. Inte ett viktat index: En plats med ett absolut rättsligt hinder får inte hamna på ”måttligt lämplig” bara för att vattnet är bra.
    - En **kalibreringsnivå** vid varje siffra - lokalt kalibrerad, regionalt extrapolerad, litteraturvärde eller kontraindicerad. Innan pilotdata från WP3 finns tillgängliga är i stort sett varje siffra för södra Östersjön ett litteraturvärde, och verktyget anger det direkt vid siffran.
    - **Övergödningsbelastning** från bow-tie-modellen i MARBEFES och valfria **drivdata för näringsämnen** från boxmodellen EUTROPY, båda redovisade vid sidan av rangordningen och aldrig inräknade i den.

    - **Program** - Interreg South Baltic 2021-2027 · **SeaGarden** (STHB.02.02-IP.01-0006/25)
    - **Arbetspaket / aktivitet** - WP2 / A2.3 · Leverans **D2.2**
    - **Ansvarig** - Klaipeda University, Marine Research Institute
    - **Status** - prototyp · modellkärna `v{version}`

    Källkod och ärenden: [{repo_name}]({repo_url})

    Tal skrivs med decimalpunkt och datum skrivs år-månad-dag på alla språk.

    *Prototyp. Resultaten är vägledande och utgör inte grund för tillstånd eller medgivande. Medfinansieras av Europeiska unionen; de åsikter som uttrycks är endast författarnas egna.*
  app.shell.help.title: "Så använder du SeaGarden DST"
  app.shell.help.body: |
    **Arbetsgång**

    1. **Plats** - välj ett delområde. I det färdiga verktyget ritar du en polygon; prototypen använder platshållarvärden för varje delområde.
    2. **Katalog** - välj arter, odlingsmetod och skala.
    3. **Bedöm** - knappen i sidopanelen. ”Resultat” och ”Rapport” förblir tomma tills du trycker på den och töms igen så fort du väljer en annan plats.
    4. **Resultat** - de rangordnade alternativen, den avgörande begränsningen för vart och ett och avlägsnandet av näringsämnen med dess kalibreringsnivå.
    5. **Rapport** - bedömningen som text, inklusive förbehåll.

    **Så läser du kalibreringsnivåerna**

    | Nivå | Betydelse | Visning |
    |---|---|---|
    | A | Anpassad till pilotdata från SeaGarden | värde med konfidensintervall |
    | B | Anpassad någon annanstans i Östersjön | värde som spann |
    | C | Litteraturvärde, ingen lokal validering | storleksordningsintervall |
    | D | Kontraindicerad - en lokal iakttagelse motsäger modellen | iakttagelsen, i stället för siffran |

    Fallet på nivå D som är värt att känna till: sockertare under ungefär 16 psu. Salthaltsskalningen ger en liten positiv avkastning; pilotförsöket i OLAMUR konstaterade att odlingen misslyckades helt vid 5.5-6.5 psu. Verktyget visar iakttagelsen.
  app.shell.feedback.title: "Lämna synpunkter"
  app.shell.feedback.body: |
    Det här är en samutvecklad prototyp för WP2 A2.3. Konkreta synpunkter - vilken panel, vilken plats, vad du förväntade dig - är mest användbara.

    - **Öppna ett ärende** - [{repo_url}/issues/new]({repo_url}/issues/new)
    - **E-post** - [{email}](mailto:{email}?subject=SeaGarden%20DST%20feedback)
