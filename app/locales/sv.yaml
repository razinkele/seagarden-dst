  app.site.provenance_body: |
    Kartan visar **var** ett delområde ligger. Siffrorna nedan är **platshållarvärden**, en uppsättning per delområde: rimliga värden i rätt storleksordning, inte mätningar och inte avlästa vid positionen. Alla resultat som härleds från dem är litteraturvärden.

    I det färdiga verktyget ritar du en polygon, och förhållandena läses ut från de kuraterade dataskikten - Copernicus Marine-återanalys för salthalt, temperatur och näringsämnen, EMODnet för batymetri och mänskligt nyttjande, HELCOM för skyddade områden. Gränssnittet mellan den här panelen och modellkärnan ändras inte.
