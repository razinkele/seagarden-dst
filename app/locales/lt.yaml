  app.shell.about.title: "Apie SeaGarden DST"
  app.shell.about.body: |
    **SeaGarden sprendimų paramos įrankis** (Decision Support Tool, DST) padeda planuoti bendruomenių inicijuojamus regeneracinius jūrinius ūkius Pietų Baltijoje. Pasirinkite vietą, nuspręskite, ką ir kokiu mastu auginti, o įrankis pateiks vietos tinkamumo klasę, tikėtiną derlių ir azoto, fosforo bei anglies kiekius, kuriuos šis derlius pašalina iš vandens.

    **Ką gaunate**

    - Vietos tinkamumo klasę, apskaičiuotą kaip ribojimų klasių **minimumą**, nurodant lemiamą ribojimą. Tai ne svertinis indeksas: vieta, kuriai taikomas besąlygiškas teisinis draudimas, negali būti įvertinta kaip „vidutinė“ vien todėl, kad vanduo geras.
    - **Kalibravimo lygmenį** prie kiekvieno skaičiaus - kalibruota vietos duomenimis, ekstrapoliuota iš kito regiono, literatūrinė vertė arba kontraindikuotina. Kol nėra WP3 bandomųjų vietų duomenų, beveik kiekvienas Pietų Baltijos skaičius yra literatūrinė vertė, ir įrankis tai nurodo prie paties skaičiaus.
    - **Eutrofikacijos pavojų** pagal MARBEFES bow-tie modelį ir pasirinktinai **maistinių medžiagų įvesties duomenis** iš EUTROPY dėžinio modelio - abu pateikiami šalia reitingo ir niekada į jį neįtraukiami.

    - **Programa** - Interreg South Baltic 2021-2027 · **SeaGarden** (STHB.02.02-IP.01-0006/25)
    - **Darbų paketas / veikla** - WP2 / A2.3 · Produktas **D2.2**
    - **Vadovaujantis partneris** - Klaipėdos universitetas, Jūros tyrimų institutas
    - **Būsena** - prototipas · modelio branduolys `v{version}`

    Pirminis kodas ir pranešimai apie klaidas: [{repo_name}]({repo_url})

    Visomis kalbomis skaičiuose naudojamas dešimtainis taškas, o datos rašomos formatu metai-mėnuo-diena.

    *Prototipas. Rezultatai yra orientaciniai ir nėra pagrindas leidimui ar sutikimui. Bendrai finansuoja Europos Sąjunga; išreikštos nuomonės yra tik autorių.*
  app.shell.help.title: "Kaip naudotis SeaGarden DST"
  app.shell.help.body: |
    **Darbo eiga**

    1. **Vieta** - pasirinkite subregioną. Galutiniame įrankyje nubrėšite daugiakampį; prototipe kiekvienam subregionui naudojamos pakaitinės sąlygos.
    2. **Katalogas** - pasirinkite rūšis, auginimo metodą ir mastą.
    3. **Vertinti** - mygtukas šoninėje juostoje. Skirtukai „Rezultatai“ ir „Ataskaita“ lieka tušti, kol jo nepaspausite, ir vėl išvalomi, vos tik pakeičiate vietą.
    4. **Rezultatai** - variantų reitingas, kiekvieno varianto lemiamas ribojimas ir maistinių medžiagų šalinimas su kalibravimo lygmeniu.
    5. **Ataskaita** - vertinimas tekstu, kartu su išlygomis.

    **Kaip skaityti kalibravimo lygmenis**

    | Lygmuo | Reikšmė | Kaip rodoma |
    |---|---|---|
    | A | Pritaikyta pagal SeaGarden bandomųjų vietų duomenis | vertė su intervalu |
    | B | Pritaikyta pagal duomenis iš kitos Baltijos jūros vietos | vertė kaip diapazonas |
    | C | Literatūrinė vertė, be validavimo vietos duomenimis | dydžio eilės intervalas |
    | D | Kontraindikuotina - vietos tyrimais nustatytas faktas prieštarauja modeliui | nustatytas faktas, vietoj skaičiaus |

    D lygmens atvejis, kurį verta žinoti: cukrinė laminarija, kai druskingumas mažesnis nei apie 16 psu. Druskingumo koeficientas duoda nedidelį teigiamą derlių; OLAMUR bandomojoje vietoje esant 5.5-6.5 psu auginimas visiškai nepavyko. Įrankis rodo šį nustatytą faktą.
  app.shell.feedback.title: "Siųsti atsiliepimą"
  app.shell.feedback.body: |
    Tai bendrai kuriamas WP2 A2.3 prototipas. Naudingiausi yra konkretūs atsiliepimai - kuris skydelis, kuri vieta, ko tikėjotės.

    - **Praneškite apie problemą** - [{repo_url}/issues/new]({repo_url}/issues/new)
    - **El. paštas** - [{email}](mailto:{email}?subject=SeaGarden%20DST%20feedback)
