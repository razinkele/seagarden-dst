  app.site.provenance_body: |
    Žemėlapyje parodyta, **kur** yra subregionas. Toliau pateikti skaičiai yra **pakaitinės sąlygos**, po vieną rinkinį kiekvienam subregionui: tikėtinos dydžio eilės vertės, o ne matavimai, ir jos nenuskaitomos pagal padėtį. Kiekvienas iš jų gautas rezultatas yra literatūrinė vertė.

    Galutiniame įrankyje nubrėšite daugiakampį, o sąlygos bus nuskaitomos iš kuruojamų duomenų sluoksnių - druskingumas, temperatūra ir maistinės medžiagos iš Copernicus Marine reanalizės, batimetrija ir žmogaus veikla iš EMODnet, saugomos teritorijos iš HELCOM. Sąsaja tarp šio skydelio ir modelio branduolio nesikeičia.
