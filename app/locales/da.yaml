  app.shell.about.title: "Om SeaGarden DST"
  app.shell.about.body: |
    **SeaGarden-beslutningsstøtteværktøjet** (Decision Support Tool, DST) hjælper med at planlægge fællesskabsdrevne, regenerative havfarme i den sydlige Østersø. Vælg en lokalitet, hvad der skal dyrkes, og i hvilken skala, så giver værktøjet en egnethedsklassificering af lokaliteten, en forventet høst og de mængder kvælstof, fosfor og kulstof, som høsten fjerner fra vandet.

    **Hvad værktøjet giver dig**

    - En egnethedsklassificering af lokaliteten, beregnet som **minimum** på tværs af begrænsningsklasserne og med angivelse af den afgørende begrænsning. Ikke et vægtet indeks: En lokalitet med en ubetinget juridisk udelukkelse må ikke ende som »moderat«, blot fordi vandet er godt.
    - Et **kalibreringsniveau** ved hvert tal - lokalt kalibreret, regionalt ekstrapoleret, litteraturværdi eller kontraindiceret. Indtil pilotdataene fra WP3 foreligger, er stort set alle tal for den sydlige Østersø litteraturværdier, og det angiver værktøjet direkte ved tallet.
    - **Eutrofieringsbelastning** fra MARBEFES' bow-tie-model og valgfri **næringsstofforcering** fra EUTROPY-boksmodellen, begge rapporteret ved siden af rangordningen og aldrig indregnet i den.

    - **Program** - Interreg South Baltic 2021-2027 · **SeaGarden** (STHB.02.02-IP.01-0006/25)
    - **Arbejdspakke / aktivitet** - WP2 / A2.3 · Leverance **D2.2**
    - **Ledende partner** - Klaipeda University, Marine Research Institute
    - **Status** - prototype · modelkerne `v{version}`

    Kildekode og issues: [{repo_name}]({repo_url})

    Tal skrives med decimalpunktum, og datoer skrives år-måned-dag på alle sprog.

    *Prototype. Resultaterne er vejledende og udgør ikke et grundlag for tilladelse eller godkendelse. Medfinansieret af Den Europæiske Union; de udtrykte synspunkter er udelukkende forfatternes egne.*
  app.shell.help.title: "Sådan bruger du SeaGarden DST"
  app.shell.help.body: |
    **Arbejdsgang**

    1. **Lokalitet** - vælg et delområde. I det færdige værktøj tegner du en polygon; prototypen bruger pladsholderværdier for hvert delområde.
    2. **Katalog** - vælg arter, dyrkningsmetode og skala.
    3. **Vurdér** - knappen i sidepanelet. »Resultater« og »Rapport« forbliver tomme, indtil du trykker på den, og ryddes igen, så snart du skifter lokalitet.
    4. **Resultater** - de rangordnede muligheder, den afgørende begrænsning for hver af dem og næringsstoffjernelsen med dens kalibreringsniveau.
    5. **Rapport** - vurderingen som tekst, inklusive forbehold.

    **Sådan læses kalibreringsniveauerne**

    | Niveau | Betydning | Visning |
    |---|---|---|
    | A | Tilpasset SeaGarden-pilotdata | værdi med et interval |
    | B | Tilpasset et andet sted i Østersøen | værdi som et spænd |
    | C | Litteraturværdi, ingen lokal validering | størrelsesordensbånd |
    | D | Kontraindiceret - et lokalt fund modsiger modellen | fundet, i stedet for tallet |

    Et tilfælde på niveau D, som er værd at kende: sukkertang under ca. 16 psu. Saltholdighedsskaleringen giver et lille positivt udbytte; OLAMUR-pilotforsøget konstaterede, at dyrkningen slog helt fejl ved 5.5-6.5 psu. Værktøjet viser fundet.
  app.shell.feedback.title: "Send feedback"
  app.shell.feedback.body: |
    Dette er en samudviklet prototype til WP2 A2.3. Konkret feedback - hvilket panel, hvilken lokalitet, hvad du forventede - er den mest nyttige.

    - **Opret et issue** - [{repo_url}/issues/new]({repo_url}/issues/new)
    - **E-mail** - [{email}](mailto:{email}?subject=SeaGarden%20DST%20feedback)
