  app.site.provenance_body: |
    Kortet viser, **hvor** et delområde ligger. Tallene nedenfor er **pladsholderværdier**, ét sæt pr. delområde: plausible værdier i den rigtige størrelsesorden, ikke målinger og ikke aflæst ved positionen. Alle resultater, der er afledt af dem, er litteraturværdier.

    I det færdige værktøj tegner du en polygon, og forholdene aflæses fra de kuraterede datalag - Copernicus Marine-reanalyse for saltholdighed, temperatur og næringsstoffer, EMODnet for bathymetri og menneskelig anvendelse, HELCOM for beskyttede områder. Grænsefladen mellem dette panel og modelkernen ændres ikke.
