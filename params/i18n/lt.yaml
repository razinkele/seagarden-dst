# The Lithuanian sidecar for text that lives in the parameter YAML (design I§5.4): species and
# method names, calibration notes. A machine draft, not yet reviewed. There is no English
# file beside it: the reference keys and texts are derived by params_reference_keys() in
# app/i18n.py. Scientific names and calibration `source:` citations are not in it.
