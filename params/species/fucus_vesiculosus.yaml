# Fucus vesiculosus - bladderwrack
#
# Parameters adapted from OLAMUR D3.2, which re-parameterised a Saccharina framework
# for Fucus after sugar kelp failed at low salinity in Tagalaht Bay, Estonia
# (5.5-6.5 psu). This is the first documented cultivation success in Baltic
# low-salinity conditions and the closest published analogue for the SE Baltic.
#
# NOTE: no salinity term. OLAMUR found none was needed once the model was calibrated
# for Baltic conditions - salinity was not limiting for Fucus once adapted. This is
# stated explicitly on the tool's methods page because users expect a salinity term
# and its absence otherwise reads as an omission.

key: fucus_vesiculosus
scientific_name: Fucus vesiculosus
common_name: Bladderwrack
group: macroalga
in_application_form: false
cultivation_window: [4, 10]   # April-October, the OLAMUR Tagalaht cycle

growth:
  mu_max: 0.090           # 1/day
  i_k: 110.0              # umol photons/m2/s
  arrhenius_temp: 6200.0  # K
  ref_temp_c: 15.0
  upper_temp_c: 22.0
  k_nitrate: 3.0          # umol N/L
  loss_rate: 0.006        # 1/day
  b_initial: 20.0         # g DW/m2 seeded
  b_max: 5200.0           # g DW/m2, upper Tagalaht reference harvest
  b_max_basis: assumed_from_anchor   # This is the anchor's own upper bound, so the model
                                     # cannot overshoot the range it is validated
                                     # against. Re-source from A3.2 as-built line
                                     # loading, or from a standing-stock ceiling in the
                                     # Fucus literature. Until then the dry-weight anchor
                                     # is not an independent check.

salinity:
  applies: false
  tolerance_floor_psu: 4.0
  floor_basis: assumed          # Fucus vesiculosus persists into the Bothnian Bay at
                                 # 3-4 psu but with sharply reduced growth. No cultivation
                                 # trial below 4 psu is known to us. Refine against A3.4.
  demonstrated_salinity_range: [5.5, 6.5]   # OLAMUR Tagalaht pilot

elemental:
  basis: dry_weight
  nitrogen: 0.020         # ASSUMED. Was byte-identical to Saccharina's (1.0%, OLAMUR
                          # D2.3 "Kelp DM"), copied across and never marked. 2.0% is a
                          # mid-range guess spanning the 1.5-2.5% DW reported for Fucus
                          # vesiculosus in Baltic literature - not fitted, not sourced.
                          # The source to verify against: Lehvo, Back & Kiirikki (2001),
                          # "Growth of Fucus vesiculosus L. (Phaeophyta) in the Northern
                          # Baltic Proper: Energy and Nitrogen Storage in a Seasonal
                          # Environment", Botanica Marina 44(4), doi:10.1515/bot.2001.044.
                          # That paper is closed access and has NOT been read - its
                          # numbers are not behind this value. Do not treat this as
                          # sourced until someone has actually read it. Refine against A3.4.
  phosphorus: 0.0020      # ASSUMED, same provenance caveat as nitrogen above.
  carbon: 0.31            # ASSUMED. Fucus is slightly lower in C than kelp; 31% DW
                          # taken as a mid-range guess, not fitted.
  dry_matter: 0.17        # ASSUMED. Fucoid brown algae are typically 15-20% DM of
                          # fresh weight; 17% is a mid-range guess, not fitted. Needed
                          # only so the tool can produce the spec 7.1 t FW/ha figure
                          # from this species' dry-weight harvest. Refine against A3.4.

calibration:
  - region: EE-coastal
    tier: B
    source: OLAMUR D3.2
    calibrated_on: Tagalaht Bay, Estonia (5.5-6.5 psu)
  - region: LT-coastal
    tier: C
    source: OLAMUR D3.2
    calibrated_on: Tagalaht Bay, Estonia
    note: >-
      Transferred from an Estonian pilot at comparable salinity. No Lithuanian
      calibration exists; promote to tier A once WP3 A3.4 data is available.
  - region: default
    tier: C
    source: OLAMUR D3.2
    calibrated_on: Tagalaht Bay, Estonia

anchors:
  # From specification 7.2 and ../Relevant projects/OLAMUR-solutions-for-SeaGarden.md:19.
  # The basis below is TRANSCRIBED FROM THOSE SUMMARIES, not read from OLAMUR D3.2
  # itself. Re-source from D3.2 and correct if it differs.
  #
  # `reconciles` asks one specific question per arm: does simulate()'s own final
  # biomass, scaled by this species' elemental fractions, land inside the published
  # range below? It does NOT ask whether the fractions are mutually consistent with
  # each other given the published dry weight alone - that is a different question,
  # computed throughout this file's notes: block, and the two do not always agree.
  - quantity: dry_weight
    low: 4800.0
    high: 5200.0
    unit: g DW/m2
    basis: per 6 m2 cage, April-October cycle
    source: OLAMUR D3.2, Tagalaht Bay
    reconciles: false        # model gives 3446 g DW/m2, ~28% below the 4800 g floor
  - quantity: carbon
    low: 10.0
    high: 13.0
    unit: kg C
    basis: per 6 m2 cage, April-October cycle
    source: OLAMUR D3.2, Tagalaht Bay
    reconciles: false        # model gives 6.41 kg (3446 g/m2 x 6 m2 x 0.31), below
  - quantity: nitrogen
    low: 1.4
    high: 3.4
    unit: kg N
    basis: per 6 m2 cage, April-October cycle
    source: OLAMUR D3.2, Tagalaht Bay
    reconciles: false        # model gives 0.41 kg (3446 g/m2 x 6 m2 x 0.020), far below
  - quantity: phosphorus
    low: 15.0
    high: 120.0
    unit: g P
    basis: per 6 m2 cage, April-October cycle
    source: OLAMUR D3.2, Tagalaht Bay
    # reconciles defaults to true: model gives 41.4 g (3446 g/m2 x 6 m2 x 0.0020), inside

notes: >-
  Reference yields for validation (OLAMUR D3.2, per 6 m2 cage, April-October):
  4800-5200 g DW/m2, approximately 10-13 kg C, 1.4-3.4 kg N, 15-120 g P.

  The nitrogen arm of the Tagalaht anchor does not reconcile. Computing every arm from
  the published dry weight, under the kelp fractions this file previously carried (1.0%
  N, 0.17% P, 32% C), gives P 49-53 g against a published 15-120 g (inside), C 9.22-9.98
  kg against 10-13 kg (marginally below), and N against a published 1.4-3.4 kg that is
  several times higher than these fractions produce. A single basis error would move all
  three arms together and does not explain this pattern. Correcting the kelp fractions
  above narrows the nitrogen gap (with the new fractions, N becomes 0.58-0.62 kg, P
  57.6-62.4 g still inside, C 8.93-9.67 kg still marginally below) but does not close it.
  Treat the published N figure as unreconciled until it is re-sourced from OLAMUR D3.2
  with its basis stated.
