# Saccharina latissima - sugar kelp
#
# Carried for completeness and for the Danish Great Belt pilot, and as the canonical
# demonstration of calibration tier D.
#
# OLAMUR's salinity scaling returns a small positive yield at Lithuanian salinities
# (under 25% of North Sea yield). Their own Tagalaht pilot found outright cultivation
# FAILURE at 5.5-6.5 psu. A number and a finding disagree, so below the tolerance
# floor the tool suppresses the number and shows the finding - see growth.contraindication
# and specification section 5.3.

key: saccharina_latissima
scientific_name: Saccharina latissima
common_name: Sugar kelp
group: macroalga
in_application_form: false
cultivation_window: [10, 6]  # deployed in autumn, harvested early summer; wraps the year

yield_model: salinity_indexed   # OLAMUR D2.3's published form. The growth: block below
                                # is retained for reference and is NOT used to produce
                                # the harvest for this species.

growth:
  mu_max: 0.055           # 1/day
  i_k: 85.0               # umol photons/m2/s
  arrhenius_temp: 6000.0  # K
  ref_temp_c: 12.0
  upper_temp_c: 18.0
  k_nitrate: 3.5          # umol N/L
  loss_rate: 0.008        # 1/day
  b_initial: 15.0         # g DW/m2
  b_max: 2000.0           # g DW/m2

salinity:
  applies: true
  upper_psu: 25.0
  lower_psu: 16.0
  upper_divisor: 18.0
  lower_divisor: 32.0
  tolerance_floor_psu: 16.0
  floor_basis: observed         # OLAMUR's Tagalaht Bay pilot documented outright
                                 # cultivation failure at 5.5-6.5 psu - a finding, not
                                 # an assumption. See calibration note below.

max_yield_t_fw_ha: 18.4   # Danish sites above 16 psu, OLAMUR D2.3

elemental:
  basis: dry_weight
  nitrogen: 0.010
  phosphorus: 0.0017
  carbon: 0.32
  dry_matter: 0.10        # ASSUMED. Saccharina DM is typically 10-12% of fresh weight;
                          # OLAMUR publishes a dry-matter figure for mussels but not for
                          # kelp. Only affects the DW conversion, not the 18.4 t FW/ha
                          # anchor the model is checked against. Refine against A3.4.

calibration:
  - region: DK-belt
    tier: C
    source: OLAMUR D2.3 / Maar et al. 2023
    calibrated_on: Danish sites above 16 psu
    note: >-
      Moved from tier B to C: no coefficient in this file is fitted to Danish data.
      18.4 t FW/ha is a published yield figure from Danish sites, which makes it a
      literature prior applied at the site it was measured, not a local calibration -
      "local" would mean fitted to a SeaGarden pilot, which does not exist here.
  - region: LT-coastal
    tier: D
    source: OLAMUR pilot finding, Tagalaht Bay
    note: >-
      Sugar kelp cultivation failed at 5.5-6.5 psu in OLAMUR's Estonian pilot.
      The salinity scaling would return a small positive yield at Lithuanian
      salinities; that number is not shown, because the observation contradicts it.
      Fucus, Chorda or mitigation mussels are the appropriate choices here.
  - region: PL-lagoon
    tier: D
    source: OLAMUR pilot finding, Tagalaht Bay
    note: >-
      Salinity in the Szczecin Lagoon is far below the demonstrated tolerance for
      this species. Not cultivable.
  - region: default
    tier: C
    source: OLAMUR D2.3 / Maar et al. 2023
    calibrated_on: Danish sites above 16 psu

notes: >-
  The window runs October to June: deployed in autumn, harvested the following early
  summer. It wraps the year boundary, which `forcing.daily_forcing` handles by running
  the day axis past 365. It replaces a January-June stand-in that was there only
  because the generator could not express a wrapping window.

  That stand-in was annotated as understating the harvest, but "harvest" there meant
  the `growth:` block's ODE trajectory, not the number this species now reports:
  `yield_model: salinity_indexed` above means the actual harvest comes from
  `f_salinity x max_yield_t_fw_ha`, and the `growth:` block above is retained for
  reference only, still runnable via `growth.simulate` but not called by
  `harvest_biomass` for this species. Measured on the ODE path only, the stand-in's
  claim does the opposite of what it said: at DK-belt the real window returns 37.75
  against 40.36 g DW/m2 from `simulate()`, about 6.5 per cent LOWER. One placeholder
  artefact, not a property of the window: `loss_rate` is a constant, so below roughly
  8 degrees the gross growth rate falls under it and modelled biomass declines from
  October to January. A second artefact has since been retired - the DIN drawdown used
  to be spread across the window rather than the calendar, so a longer window arrived
  at spring with less nitrogen - and retiring it is why these figures moved (36.9 and
  44.8 previously, an 18 per cent gap) and why the gap narrowed: Oct-June is the one
  shipped window whose season term reaches midwinter, so calendar-day indexing RAISED
  this trajectory by 2.3 per cent while lowering every other ODE yield. Both belong to
  the retained ODE and have no bearing on the salinity-indexed harvest actually
  reported; expect this specific `simulate()` figure to move again if the section 6
  climatologies land and someone refits the `growth:` block against A3.4 - the
  direction is not yet meaningful, and doing so would not change the harvest this
  species now ships.

  The two months are ASSUMED, not fitted - the same standing as the Chorda
  coefficients. Neither the Application Form nor OLAMUR D2.3 states a deployment date
  for the Danish sites; October-June is the conventional Baltic sugar kelp cycle.
  Refine against PP5's as-deployed records from A3.4, and treat the exact start month
  as uncertain to about a month in either direction.

  This does not change the calibration tier. Tier describes how the growth
  coefficients were fitted, not when the line went in the water.
