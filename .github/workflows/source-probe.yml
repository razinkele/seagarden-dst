name: source-probe

# Separate from ci.yml on purpose (C§8.2): a dead upstream source turns this job red
# and blocks no pull request. Gating merges on the continued existence of a
# third-party service would make every PR hostage to Copernicus.
on:
  # GitHub disables `schedule:` triggers after 60 days with no repository activity.
  # On a deliverable with no maintenance budget this job can then silently stop
  # firing — nobody sees red because nothing runs at all, the same "a check that
  # cannot fail" hazard the empty-REGISTRY guard in refresh_layers.py exists to
  # prevent, one level up. `workflow_dispatch` is the manual fallback; there is no
  # automated fallback for a repository that goes quiet for 60+ days.
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the first of each month
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        # WITH the spatial extra, as of C-c2. probe() calls
        # copernicusmarine.describe(dataset_id=...), which lives there. Until C-c2
        # this job installed the bare package and asserted it did so, because the
        # probe was a stdlib HTTP HEAD -- which returned 200 for a retired dataset
        # and could not see a version at all.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[spatial]"
      - name: Probe every registered source
        # No credential. describe() accepts no username, password or
        # credentials_file -- get() and subset() accept all three -- and reads no
        # cached credential file. The catalogue is public. Two Copernicus secrets
        # were passed here until C-c2 and were read by nothing (C§8.2).
        run: python -m scripts.refresh_layers --probe
