# Guards the regression tests that encode the tool's rules rather than its behaviour:
# the Tagalaht growth anchor, "pressure is never folded into the ranking", "no South
# Baltic species claims local calibration", and the caveats surviving into the report.
# Those are the assertions a well-meaning refactor breaks silently.
#
# Python 3.11 is the floor declared in pyproject; 3.13 is what a server rebuilt years
# from now will have. The tool has to be reconstructible from this repository alone,
# on no maintenance budget, to May 2034 — so CI tests the span, not one interpreter.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"

      # pyproject's addopts deselect `engines`, `e2e` AND `spatial` by default
      # (`-m 'not engines and not e2e and not spatial'`), so this bare `pytest -q`
      # leans on all three: `engines` proves the claim the adapters make — without
      # bowtiepy or EUTROPY installed the assessment still completes; `e2e` is
      # skipped for speed; `spatial` is skipped because this job's `.[app,dev]`
      # install has no xarray/h5netcdf to read the fixture with (see the `spatial`
      # job below).
      - name: Tests
        run: pytest -q

  # C§10 clause 8 is only meaningful in an install WITHOUT `spatial`, while C§7's
  # fixture tests need one WITH it. Two requirements pulling opposite ways, so two
  # jobs: the `test` job above proves the isolation, this one reads the fixture.
  spatial:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `,dev` is not optional: `spatial` declares no test runner, so
      # `pip install -e ".[spatial]"` then `pytest` fails with "command not found"
      # — installing everything needed to read the fixture and nothing to run a test against it.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[spatial,dev]"

      # `tests/` explicitly, NOT a bare `pytest -q -m spatial`. `testpaths` also lists
      # `app/tests`, whose modules import `shiny` at module scope, and this job installs
      # `[spatial,dev]` — no `shiny`. A marker cannot save it: `-m` deselects AFTER
      # collection, so the run dies with "1 error during collection" having deselected
      # everything it was asked to run.
      #
      # This job passed for weeks on an accident. `spatial` used to declare
      # `shinywidgets`, which requires `shiny>=0.6.1.9005`, so `shiny` arrived
      # transitively and `app/tests` stayed collectable. Removing `shinywidgets` when
      # the map moved to `shiny_deckgl` — a genuinely unused declaration — took the
      # undocumented prop with it and broke this job. Scoping the path states the
      # intent instead of relying on a dependency nobody meant to depend on.
      - name: Refresh tests
        run: pytest -q -m spatial tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pipx install ruff
      - run: ruff check --output-format=github .
